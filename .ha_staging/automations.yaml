- id: anenji_refresh_solar_heating_schedule
  alias: ANENJI · Обновление времени солнца и расписаний нагрева
  description: Один раз задаёт безопасные начальные значения новых расписаний (09:00–16:00,
    ручное время, сдвиг 0 минут, порог PV 50 Вт), затем хранит выбор пользователя.
    Также ежедневно сохраняет сегодняшние восход и закат для окон бойлера и бассейна.
  initial_state: true
  triggers:
  - trigger: homeassistant
    event: start
    id: home_assistant_start
  - trigger: time
    at: 00:01:00
    id: new_day
  - trigger: state
    entity_id:
    - sensor.sun_next_rising
    - sensor.sun_next_setting
    id: sun_times_changed
  conditions: []
  actions:
  - if:
    - condition: state
      entity_id: input_boolean.anenji_surplus_schedule_defaults_initialized
      state: 'off'
    then:
    - action: input_select.select_option
      target:
        entity_id:
        - input_select.anenji_surplus_boiler_start_reference
        - input_select.anenji_surplus_boiler_end_reference
        - input_select.anenji_surplus_pool_start_reference
        - input_select.anenji_surplus_pool_end_reference
      data:
        option: Ручное время
    - action: input_datetime.set_datetime
      target:
        entity_id:
        - input_datetime.anenji_surplus_boiler_start_time
        - input_datetime.anenji_surplus_pool_start_time
      data:
        time: 09:00:00
    - action: input_datetime.set_datetime
      target:
        entity_id:
        - input_datetime.anenji_surplus_boiler_end_time
        - input_datetime.anenji_surplus_pool_end_time
      data:
        time: '16:00:00'
    - action: input_number.set_value
      target:
        entity_id:
        - input_number.anenji_surplus_boiler_start_solar_offset_min
        - input_number.anenji_surplus_boiler_end_solar_offset_min
        - input_number.anenji_surplus_pool_start_solar_offset_min
        - input_number.anenji_surplus_pool_end_solar_offset_min
      data:
        value: 0
    - action: input_number.set_value
      target:
        entity_id: input_number.anenji_surplus_minimum_pv_power_w
      data:
        value: 300
    - action: input_number.set_value
      target:
        entity_id: input_number.anenji_surplus_failed_probe_retry_sec
      data:
        value: 10
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.anenji_surplus_schedule_defaults_initialized
  - if:
    - condition: state
      entity_id: input_boolean.anenji_surplus_pv_probe_defaults_initialized
      state: 'off'
    then:
    - action: input_number.set_value
      target:
        entity_id: input_number.anenji_surplus_failed_probe_retry_sec
      data:
        value: 10
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.anenji_surplus_pv_probe_defaults_initialized
  - if:
    - condition: template
      value_template: "{{ has_value('sensor.sun_next_rising')\n   and has_value('sensor.sun_next_setting')
        }}"
    then:
    - variables:
        sunrise_today: "{% set event = as_local(as_datetime(states('sensor.sun_next_rising')))
          %} {% set today = now().date() %} {{ (event - timedelta(days=1)).strftime('%Y-%m-%d
          %H:%M:%S')\n   if event.date() > today else event.strftime('%Y-%m-%d %H:%M:%S')
          }}"
        sunset_today: "{% set event = as_local(as_datetime(states('sensor.sun_next_setting')))
          %} {% set today = now().date() %} {{ (event - timedelta(days=1)).strftime('%Y-%m-%d
          %H:%M:%S')\n   if event.date() > today else event.strftime('%Y-%m-%d %H:%M:%S')
          }}"
        sunrise_option: Восход солнца
        sunset_option: Закат солнца
        boiler_start_option: "{% set source = states('input_select.anenji_surplus_boiler_start_reference')
          %} {{ sunrise_option if source.startswith('Восход солнца')\n   else sunset_option
          if source.startswith('Закат солнца')\n   else 'Ручное время' }}"
        boiler_end_option: "{% set source = states('input_select.anenji_surplus_boiler_end_reference')
          %} {{ sunrise_option if source.startswith('Восход солнца')\n   else sunset_option
          if source.startswith('Закат солнца')\n   else 'Ручное время' }}"
        pool_start_option: "{% set source = states('input_select.anenji_surplus_pool_start_reference')
          %} {{ sunrise_option if source.startswith('Восход солнца')\n   else sunset_option
          if source.startswith('Закат солнца')\n   else 'Ручное время' }}"
        pool_end_option: "{% set source = states('input_select.anenji_surplus_pool_end_reference')
          %} {{ sunrise_option if source.startswith('Восход солнца')\n   else sunset_option
          if source.startswith('Закат солнца')\n   else 'Ручное время' }}"
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.anenji_surplus_sunrise_today
      data:
        datetime: '{{ sunrise_today }}'
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.anenji_surplus_sunset_today
      data:
        datetime: '{{ sunset_today }}'
    - action: input_select.set_options
      target:
        entity_id:
        - input_select.anenji_surplus_boiler_start_reference
        - input_select.anenji_surplus_boiler_end_reference
        - input_select.anenji_surplus_pool_start_reference
        - input_select.anenji_surplus_pool_end_reference
      data:
        options:
        - Ручное время
        - '{{ sunrise_option }}'
        - '{{ sunset_option }}'
    - action: input_select.select_option
      target:
        entity_id: input_select.anenji_surplus_boiler_start_reference
      data:
        option: '{{ boiler_start_option }}'
    - action: input_select.select_option
      target:
        entity_id: input_select.anenji_surplus_boiler_end_reference
      data:
        option: '{{ boiler_end_option }}'
    - action: input_select.select_option
      target:
        entity_id: input_select.anenji_surplus_pool_start_reference
      data:
        option: '{{ pool_start_option }}'
    - action: input_select.select_option
      target:
        entity_id: input_select.anenji_surplus_pool_end_reference
      data:
        option: '{{ pool_end_option }}'
  mode: single
  max_exceeded: silent
- id: weather_rain_delay_all_irrigation_zones
  alias: Автополив — единый контроль отсрочек
  description: Хранит абсолютное время окончания погодной отсрочки и объединяет
    все причины блокировки полива — осадки, ручной режим, зиму и 0% по температуре.
    Повторяет MQTT-команду всем зонам POLIV1 и POLIV2, поэтому суточный сброс ESP32
    или случайное выключение одной отсрочки не отменяет действующую блокировку.
  initial_state: true
  triggers:
  - trigger: state
    entity_id:
    - sensor.irrigation_open_meteo_rain_intensity
    - sensor.irrigation_combined_rain_24h
    - input_number.irrigation_rain_delay_hours_per_mm
    to:
    id: rain_or_settings_changed
  - trigger: state
    entity_id:
    - input_boolean.irrigation_force_delay_until_midnight
    - input_boolean.irrigation_winter_mode
    - input_boolean.irrigation_temperature_zero_hold
    to:
    id: safety_hold_changed
  - trigger: template
    value_template: >-
      {% set end_ts = state_attr('input_datetime.irrigation_rain_delay_until', 'timestamp') | float(0) %}
      {% set deadline_valid = has_value('input_datetime.irrigation_rain_delay_until') %}
      {% set hold = is_state('input_boolean.irrigation_force_delay_until_midnight', 'on')
           or is_state('input_boolean.irrigation_winter_mode', 'on')
           or is_state('input_boolean.irrigation_temperature_zero_hold', 'on')
           or end_ts > as_timestamp(now())
           or (is_state('input_boolean.irrigation_rain_delay_command_active', 'on') and not deadline_valid) %}
      {{ hold and expand(
           'switch.poliv_zona_1_otsrochka_poliva',
           'switch.poliv_zona_2_otsrochka_poliva',
           'switch.poliv_zona_3_otsrochka_poliva',
           'switch.poliv_zona_4_otsrochka_poliva',
           'switch.poliv_zona_1_otsrochka_poliva_2',
           'switch.poliv_zona_2_otsrochka_poliva_2',
           'switch.poliv_zona_3_otsrochka_poliva_2',
           'switch.poliv_zona_4_otsrochka_poliva_2')
         | selectattr('state', 'eq', 'off') | list | count > 0 }}
    id: controller_delay_reset
  - trigger: time_pattern
    minutes: /1
    id: heartbeat
  - trigger: time
    at: input_datetime.irrigation_rain_delay_until
    id: calculated_delay_ended
  - trigger: time
    at: '23:59:55'
    id: reset_manual_delay
  - trigger: homeassistant
    event: start
    id: ha_start
  actions:
  - if:
    - condition: trigger
      id: reset_manual_delay
    then:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.irrigation_force_delay_until_midnight
  - if:
    - condition: trigger
      id: ha_start
    - condition: template
      value_template: '{{ not is_state(''input_boolean.irrigation_rain_delay_coefficient_initialized'',
        ''on'') }}'
    then:
    - action: input_number.set_value
      target:
        entity_id: input_number.irrigation_rain_delay_hours_per_mm
      data:
        value: 4.8
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.irrigation_rain_delay_coefficient_initialized
  - if:
    - condition: trigger
      id: ha_start
    - condition: template
      value_template: '{{ not is_state(''input_boolean.irrigation_rain_delay_defaults_initialized'',
        ''on'') }}'
    then:
    - action: input_number.set_value
      target:
        entity_id: input_number.irrigation_rain_delay_preserve_mask
      data:
        value: 0
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.irrigation_rain_delay_defaults_initialized
  - if:
    - condition: trigger
      id: ha_start
    then:
    - delay:
        seconds: 15
  - variables:
      now_ts: '{{ as_timestamp(now()) }}'
      current_rain_valid: '{{ is_number(states(''sensor.irrigation_combined_rain_24h''))
        }}'
      current_rain_mm: '{{ states(''sensor.irrigation_combined_rain_24h'') | float(0)
        }}'
      previous_rain_mm: '{{ states(''input_number.irrigation_rain_delay_previous_24h_mm'')
        | float(0) }}'
      amount_initialized: '{{ is_state(''input_boolean.irrigation_rain_delay_amount_initialized'',
        ''on'') }}'
      coefficient_hours_per_mm: '{{ states(''input_number.irrigation_rain_delay_hours_per_mm'')
        | float(0) }}'
      stored_end_ts: '{{ state_attr(''input_datetime.irrigation_rain_delay_until'',
        ''timestamp'') | float(0) }}'
      deadline_valid: "{{ has_value('input_datetime.irrigation_rain_delay_until')\n
        \  and is_number(state_attr('input_datetime.irrigation_rain_delay_until',
        'timestamp')) }}"
      manual_active: '{{ is_state(''input_boolean.irrigation_force_delay_until_midnight'',
        ''on'') }}'
      winter_active: '{{ is_state(''input_boolean.irrigation_winter_mode'', ''on'') }}'
      temperature_zero_hold_active: '{{ is_state(''input_boolean.irrigation_temperature_zero_hold'',
        ''on'') }}'
      command_active: '{{ is_state(''input_boolean.irrigation_rain_delay_command_active'',
        ''on'') }}'
  - variables:
      new_rain_mm: "{% if not current_rain_valid | bool(false) %}\n  0\n{% elif not
        amount_initialized | bool(false) %}\n  {{ current_rain_mm | float(0) }}\n{%
        else %}\n  {{ [current_rain_mm | float(0) - previous_rain_mm | float(0), 0]
        | max }}\n{% endif %}"
  - if:
    - condition: template
      value_template: '{{ current_rain_valid | bool(false) }}'
    then:
    - action: input_number.set_value
      target:
        entity_id: input_number.irrigation_rain_delay_previous_24h_mm
      data:
        value: '{{ current_rain_mm | float(0) }}'
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.irrigation_rain_delay_amount_initialized
  - variables:
      added_delay_hours: '{{ new_rain_mm | float(0) * coefficient_hours_per_mm | float(0)
        }}'
      candidate_end_ts: "{% if new_rain_mm | float(0) > 0 and coefficient_hours_per_mm
        | float(0) > 0 %}\n  {{ [stored_end_ts | float(0), now_ts | float(0)] | max\n
        \    + new_rain_mm | float(0) * coefficient_hours_per_mm | float(0) * 3600
        }}\n{% else %}\n  0\n{% endif %}"
  - if:
    - condition: template
      value_template: '{{ candidate_end_ts | float(0) > stored_end_ts | float(0) }}'
    then:
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.irrigation_rain_delay_until
      data:
        timestamp: '{{ candidate_end_ts }}'
  - variables:
      effective_end_ts: '{{ [stored_end_ts | float(0), candidate_end_ts | float(0)]
        | max }}'
      hold_active: >-
        {{ manual_active | bool(false)
           or winter_active | bool(false)
           or temperature_zero_hold_active | bool(false)
           or effective_end_ts | float(0) > now_ts | float(0)
           or (command_active | bool(false) and not deadline_valid | bool(false)) }}
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ hold_active | bool(false) }}'
      sequence:
      - if:
        - condition: state
          entity_id: input_boolean.irrigation_rain_delay_command_active
          state: 'off'
        then:
        - variables:
            preserve_mask: "{% set switches = [\n     ('switch.poliv_zona_1_otsrochka_poliva',
              1),\n     ('switch.poliv_zona_2_otsrochka_poliva', 2),\n     ('switch.poliv_zona_3_otsrochka_poliva',
              4),\n     ('switch.poliv_zona_4_otsrochka_poliva', 8),\n     ('switch.poliv_zona_1_otsrochka_poliva_2',
              16),\n     ('switch.poliv_zona_2_otsrochka_poliva_2', 32),\n     ('switch.poliv_zona_3_otsrochka_poliva_2',
              64),\n     ('switch.poliv_zona_4_otsrochka_poliva_2', 128) ] %}\n{%
              set ns = namespace(mask = 0) %} {% for entity_id, bit in switches %}\n
              \ {% if not is_state(entity_id, 'off') %}\n    {% set ns.mask = ns.mask
              + bit %}\n  {% endif %}\n{% endfor %} {{ ns.mask }}"
        - action: input_number.set_value
          target:
            entity_id: input_number.irrigation_rain_delay_preserve_mask
          data:
            value: '{{ preserve_mask }}'
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.irrigation_rain_delay_command_active
      - action: switch.turn_on
        alias: Повторить MQTT-команду отсрочки всем зонам
        continue_on_error: true
        target:
          entity_id:
          - switch.poliv_zona_1_otsrochka_poliva
          - switch.poliv_zona_2_otsrochka_poliva
          - switch.poliv_zona_3_otsrochka_poliva
          - switch.poliv_zona_4_otsrochka_poliva
          - switch.poliv_zona_1_otsrochka_poliva_2
          - switch.poliv_zona_2_otsrochka_poliva_2
          - switch.poliv_zona_3_otsrochka_poliva_2
          - switch.poliv_zona_4_otsrochka_poliva_2
    default:
    - condition: state
      entity_id: input_boolean.irrigation_rain_delay_command_active
      state: 'on'
    - variables:
        owned_entities: "{% set mask = states('input_number.irrigation_rain_delay_preserve_mask')
          | int(0) %} {% set switches = [\n     ('switch.poliv_zona_1_otsrochka_poliva',
          1),\n     ('switch.poliv_zona_2_otsrochka_poliva', 2),\n     ('switch.poliv_zona_3_otsrochka_poliva',
          4),\n     ('switch.poliv_zona_4_otsrochka_poliva', 8),\n     ('switch.poliv_zona_1_otsrochka_poliva_2',
          16),\n     ('switch.poliv_zona_2_otsrochka_poliva_2', 32),\n     ('switch.poliv_zona_3_otsrochka_poliva_2',
          64),\n     ('switch.poliv_zona_4_otsrochka_poliva_2', 128) ] %}\n{% set
          ns = namespace(entities = []) %} {% for entity_id, bit in switches %}\n
          \ {% if ((mask // bit) % 2) == 0 %}\n    {% set ns.entities = ns.entities
          + [entity_id] %}\n  {% endif %}\n{% endfor %} {{ ns.entities }}"
    - if:
      - condition: template
        value_template: '{{ owned_entities | count > 0 }}'
      then:
      - repeat:
          sequence:
          - action: switch.turn_off
            alias: Снять завершённую погодную отсрочку
            continue_on_error: true
            target:
              entity_id: '{{ owned_entities }}'
          - wait_template: "{{ expand(owned_entities)\n   | rejectattr('state', 'eq',
              'off') | list | count == 0 }}"
            timeout: 00:00:04
            continue_on_timeout: true
          until:
          - condition: template
            value_template: "{{ expand(owned_entities)\n     | rejectattr('state',
              'eq', 'off') | list | count == 0\n   or repeat.index >= 3 }}"
    - if:
      - condition: template
        value_template: "{{ owned_entities | count == 0\n   or expand(owned_entities)\n
          \    | rejectattr('state', 'eq', 'off') | list | count == 0 }}"
      then:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.irrigation_rain_delay_command_active
      - action: input_number.set_value
        target:
          entity_id: input_number.irrigation_rain_delay_preserve_mask
        data:
          value: 0
  mode: queued
  max: 30
  max_exceeded: silent
- id: irrigation_weather_location_settings
  alias: Автополив — применить место определения осадков
  description: Находит координаты указанного адреса, применяет их по нажатию и немедленно
    обновляет погодный запрос после изменения адреса или координат.
  initial_state: true
  triggers:
  - trigger: state
    entity_id:
    - input_text.irrigation_weather_address
    - input_text.irrigation_weather_latitude
    - input_text.irrigation_weather_longitude
    - input_button.irrigation_apply_address_location
  - trigger: homeassistant
    event: start
  actions:
  - if:
    - condition: template
      value_template: '{{ states(''input_text.irrigation_weather_address'') in [''unknown'',
        ''unavailable''] }}'
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.irrigation_weather_address
      data:
        value: ''
  - if:
    - condition: template
      value_template: '{{ states(''input_text.irrigation_weather_latitude'') in [''unknown'',
        ''unavailable''] }}'
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.irrigation_weather_latitude
      data:
        value: ''
  - if:
    - condition: template
      value_template: '{{ states(''input_text.irrigation_weather_longitude'') in [''unknown'',
        ''unavailable''] }}'
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.irrigation_weather_longitude
      data:
        value: ''
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id == ''input_text.irrigation_weather_address''
          }}'
      sequence:
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.irrigation_address_lookup
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id == ''input_button.irrigation_apply_address_location''
          }}'
      - condition: template
        value_template: "{{ is_number(state_attr('sensor.irrigation_address_lookup',
          'lat'))\n   and is_number(state_attr('sensor.irrigation_address_lookup',
          'lon')) }}"
      sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.irrigation_weather_latitude
        data:
          value: '{{ state_attr(''sensor.irrigation_address_lookup'', ''lat'') | float
            }}'
      - action: input_text.set_value
        target:
          entity_id: input_text.irrigation_weather_longitude
        data:
          value: '{{ state_attr(''sensor.irrigation_address_lookup'', ''lon'') | float
            }}'
  - action: homeassistant.update_entity
    target:
      entity_id: sensor.irrigation_open_meteo_rain_intensity
  mode: queued
  max: 10
  max_exceeded: silent
- id: tv_gostinaya_dream_color_backlight
  alias: Подсветка Dream Color — ТВ в гостиной
  description: Keeps the Tuya backlight state synchronized with Android TV Remote.
    Power changes are handled immediately; a lightweight watchdog repairs missed cloud
    commands and synchronizes the light after automation reloads.
  initial_state: true
  triggers:
  - trigger: state
    entity_id: media_player.smart_tv_pro
    to: 'on'
    id: tv_on
  - trigger: state
    entity_id: media_player.smart_tv_pro
    to: 'off'
    id: tv_off
  - trigger: state
    entity_id: media_player.smart_tv_pro
    to: unavailable
    for:
      seconds: 10
    id: tv_unavailable
  - trigger: homeassistant
    event: start
    id: ha_start
  - trigger: time_pattern
    seconds: /15
    id: watchdog
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: media_player.smart_tv_pro
        state: 'on'
      - condition: template
        value_template: '{{ trigger.id != ''watchdog'' or not is_state(''light.dream_color_rgb'',
          ''on'') }}'
      sequence:
      - repeat:
          sequence:
          - action: light.turn_on
            continue_on_error: true
            target:
              entity_id: light.dream_color_rgb
          - delay:
              seconds: 2
          until:
          - condition: or
            conditions:
            - condition: state
              entity_id: light.dream_color_rgb
              state: 'on'
            - condition: template
              value_template: '{{ not is_state(''media_player.smart_tv_pro'', ''on'')
                }}'
            - condition: template
              value_template: '{{ repeat.index >= (1 if trigger.id == ''watchdog''
                else 5) }}'
    - conditions:
      - condition: template
        value_template: '{{ states(''media_player.smart_tv_pro'') in [''off'', ''unavailable'']
          }}'
      - condition: template
        value_template: '{{ trigger.id != ''watchdog'' or not is_state(''light.dream_color_rgb'',
          ''off'') }}'
      sequence:
      - repeat:
          sequence:
          - action: light.turn_off
            continue_on_error: true
            target:
              entity_id: light.dream_color_rgb
          - delay:
              seconds: 2
          until:
          - condition: or
            conditions:
            - condition: state
              entity_id: light.dream_color_rgb
              state: 'off'
            - condition: template
              value_template: '{{ states(''media_player.smart_tv_pro'') not in [''off'',
                ''unavailable''] }}'
            - condition: template
              value_template: '{{ repeat.index >= (1 if trigger.id == ''watchdog''
                else 5) }}'
  mode: restart
  max_exceeded: silent
