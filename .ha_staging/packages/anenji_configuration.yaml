      # =========================
      # ЭНЕРГИЯ (как было у тебя)
      # =========================
      # Примечание: Energy Today обычно сбрасывается -> НЕ подходит для Energy Dashboard как "total_increasing".
      # Energy Total можно использовать после конвертации Wh->kWh (см. template ниже).

      - name: "Энергия сегодня (Energy Today)"
        slave: 1
        address: 4007
        input_type: holding
        data_type: int32
        swap: word
        unit_of_measurement: "Wh"
        scan_interval: 30

      - name: "Энергия всего (Energy Total)"
        slave: 1
        address: 4008
        input_type: holding
        data_type: int32
        swap: word
        unit_of_measurement: "Wh"
        scan_interval: 60


      # =========================
      # НАСТРОЙКИ (R/W) — ЧТЕНИЕ
      # =========================

      - name: "Режим выхода (Output Mode)"
        slave: 1
        address: 300
        input_type: holding
        data_type: uint16
        scan_interval: 60

      - name: "Приоритет выхода (Output Priority)"
        slave: 1
        address: 301
        input_type: holding
        data_type: uint16
        scan_interval: 5

      - name: "Диапазон входного напряжения (Input Voltage Range)"
        slave: 1
        address: 302
        input_type: holding
        data_type: uint16
        scan_interval: 60

      - name: "Зуммер (Buzzer Mode)"
        slave: 1
        address: 303
        input_type: holding
        data_type: uint16
        scan_interval: 60

      - name: "Подсветка LCD (LCD Backlight)"
        slave: 1
        address: 305
        input_type: holding
        data_type: uint16
        scan_interval: 300

      - name: "Автовозврат LCD на главную (LCD Auto Home)"
        slave: 1
        address: 306
        input_type: holding
        data_type: uint16
        scan_interval: 300

      - name: "Энергосбережение (Energy Saving)"
        slave: 1
        address: 307
        input_type: holding
        data_type: uint16
        scan_interval: 300

      - name: "Автоперезапуск при перегрузке (Overload Auto Restart)"
        slave: 1
        address: 308
        input_type: holding
        data_type: uint16
        scan_interval: 300

      - name: "Автоперезапуск при перегреве (Overtemp Auto Restart)"
        slave: 1
        address: 309
        input_type: holding
        data_type: uint16
        scan_interval: 300

      - name: "Bypass при перегрузке (Overload Bypass Enable)"
        slave: 1
        address: 310
        input_type: holding
        data_type: uint16
        scan_interval: 300

      - name: "Выравнивание АКБ (Battery Eq Enable)"
        slave: 1
        address: 313
        input_type: holding
        data_type: uint16
        scan_interval: 300

      - name: "Сухой контакт (Dry Contact)"
        slave: 1
        address: 316
        input_type: holding
        data_type: uint16
        scan_interval: 300

      - name: "Уставка выходного напряжения (Output Voltage Set)"
        slave: 1
        address: 320
        input_type: holding
        data_type: uint16
        unit_of_measurement: "V"
        scale: 0.1
        precision: 1
        scan_interval: 60

      - name: "Уставка выходной частоты (Output Frequency Set)"
        slave: 1
        address: 321
        input_type: holding
        data_type: uint16
        unit_of_measurement: "Hz"
        scale: 0.01
        precision: 2
        scan_interval: 60

      - name: "Тип АКБ (Battery Type)"
        slave: 1
        address: 322
        input_type: holding
