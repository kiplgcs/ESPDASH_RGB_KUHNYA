input_text:
  anenji_surplus_distribution_status:
    name: "ANENJI · Состояние распределения избытка"
    initial: "Ожидание первого расчёта"
    max: 255
    icon: mdi:information-outline

  # Token гарантирует, что каждый полный last_reported raw Grid будет обработан
  # ровно один раз — и быстрым state-триггером, и резервным секундным циклом.
  anenji_surplus_last_grid_report_token:
    name: "ANENJI · Последний обработанный замер сети"
    initial: "0"
    max: 64
    icon: mdi:identifier

modbus:
  - name: "ANENJI_6200W"
    type: rtuovertcp
    host: 192.168.0.74
    port: 8899

    # Оставляю как у тебя работало стабильно
    timeout: 5
    retries: 5
    delay: 2
    message_wait_milliseconds: 5

    sensors:

      # =========================
      # АВАРИИ / ПРЕДУПРЕЖДЕНИЯ
      # =========================

      - name: "Код аварий битами (Fault Bitmask)"
        slave: 1
        address: 100
        input_type: holding
        data_type: uint32
        swap: word
        scan_interval: 15

      - name: "Код предупреждений битами (Warning Bitmask, masked)"
        slave: 1
        address: 108
        input_type: holding
        data_type: uint32
        scan_interval: 15

      - name: "Маска предупреждений (Warning Mask [I])"
        slave: 1
        address: 314
        input_type: holding
        data_type: uint32
        swap: word
        scan_interval: 60


      # =========================
      # УСТРОЙСТВО / РЕЖИМЫ
      # =========================

      - name: "Тип устройства (Device type)"
        slave: 1
        address: 171
        input_type: holding
        data_type: uint16
        scan_interval: 300

      - name: "Режим работы (Working Mode)"
        slave: 1
        address: 201
        input_type: holding
        data_type: uint16
        scan_interval: 15

      - name: "Заряд АКБ % (Battery SOC)"
        slave: 1
        address: 229
        input_type: holding
        data_type: uint16
        unit_of_measurement: "%"
        scan_interval: 15

      - name: "Потоки энергии (Power Flow Status)"
        slave: 1
        address: 231
        input_type: holding
        data_type: uint16
        scan_interval: 15


      # =========================
      # СЕТЬ (GRID / MAINS)
      # =========================

      - name: "Напряжение сети (Grid Voltage)"
        slave: 1
        address: 202
        input_type: holding
        data_type: int16
        unit_of_measurement: "V"
        scale: 0.1
        precision: 1
        # Независимое подтверждение наличия ТНС для фильтра ложного Grid Power=0.
        # Две секунды быстрее защитного окна 5 с и не участвуют в регулировании Вт.
        scan_interval: 2

      - name: "Частота сети (Grid Frequency)"
        slave: 1
        address: 203
        input_type: holding
        data_type: int16
        unit_of_measurement: "Hz"
        scale: 0.01
        precision: 2
        scan_interval: 2

      # Grid является обратной связью быстрого регулятора: 1 с даёт аварийное
      # снижение лимита при облаке/новой фоновой нагрузке максимум за один цикл.
      - name: "Мощность сети (Grid Power)"
        slave: 1
        address: 204
        input_type: holding
        data_type: int16
        unit_of_measurement: "W"
        scan_interval: 1


      # =========================
      # ИНВЕРТОР / ВЫХОД
      # =========================

      - name: "Напряжение инвертора (Inverter Voltage)"
        slave: 1
        address: 205
        input_type: holding
        data_type: int16
        unit_of_measurement: "V"
        scale: 0.1
        precision: 1
        scan_interval: 15

      - name: "Ток инвертора (Inverter Current)"
        slave: 1
        address: 206
        input_type: holding
        data_type: int16
        unit_of_measurement: "A"
        scale: 0.1
        precision: 1
        scan_interval: 15

      - name: "Частота инвертора (Inverter Frequency)"
        slave: 1
        address: 207
        input_type: holding
        data_type: int16
        unit_of_measurement: "Hz"
        scale: 0.01
        precision: 2
        scan_interval: 15

      - name: "Мощность инвертора (Inverter Power)"
        slave: 1
        address: 208
        input_type: holding
        data_type: int16
        unit_of_measurement: "W"
        scan_interval: 15

      - name: "Мощность зарядки от инвертора (Inverter Charging Power)"
        slave: 1
        address: 209
        input_type: holding
        data_type: int16
        unit_of_measurement: "W"
        scan_interval: 15

      - name: "Выходное напряжение (Output Voltage)"
        slave: 1
        address: 210
        input_type: holding
        data_type: int16
        unit_of_measurement: "V"
        scale: 0.1
        precision: 1
        scan_interval: 15

      - name: "Выходной ток (Output Current)"
        slave: 1
        address: 211
        input_type: holding
        data_type: int16
        unit_of_measurement: "A"
        scale: 0.1
        precision: 1
        scan_interval: 15

      - name: "Выходная частота (Output Frequency)"
        slave: 1
        address: 212
        input_type: holding
        data_type: int16
        unit_of_measurement: "Hz"
        scale: 0.01
        precision: 2
        scan_interval: 15

      - name: "Мощность нагрузки (Load Power)"
        slave: 1
        address: 213
        input_type: holding
        data_type: int16
        unit_of_measurement: "W"
        scan_interval: 2

      - name: "Полная мощность нагрузки (Load Apparent Power)"
        slave: 1
        address: 214
        input_type: holding
        data_type: int16
        unit_of_measurement: "VA"
        scan_interval: 15


      # =========================
      # АКБ (BATTERY)
      # =========================

      - name: "Напряжение АКБ (Battery Voltage)"
        slave: 1
        address: 215
        input_type: holding
        data_type: int16
        unit_of_measurement: "V"
        scale: 0.1
        precision: 1
        scan_interval: 2

      - name: "Ток АКБ (Battery Current)"
        slave: 1
        address: 216
        input_type: holding
        data_type: int16
        unit_of_measurement: "A"
        scale: 0.1
        precision: 1
        scan_interval: 15

      - name: "Мощность АКБ (Battery Power)"
        slave: 1
        address: 217
        input_type: holding
        data_type: int16
        unit_of_measurement: "W"
        scan_interval: 15

      - name: "Ток АКБ знак ± (Battery Current Signed, filtered)"
        slave: 1
        address: 232
        input_type: holding
        data_type: int16
        unit_of_measurement: "A"
        scale: 0.1
        precision: 1
        scan_interval: 2

      - name: "Ток зарядки от инвертора (Inverter Charging Current)"
        slave: 1
        address: 233
        input_type: holding
        data_type: int16
        unit_of_measurement: "A"
        scale: 0.1
        precision: 1
        scan_interval: 30


      # =========================
      # PV (СОЛНЕЧНЫЕ ПАНЕЛИ)
      # =========================

      - name: "Напряжение PV (PV Voltage)"
        slave: 1
        address: 219
        input_type: holding
        data_type: int16
        unit_of_measurement: "V"
        scale: 0.1
        precision: 1
        scan_interval: 15

      - name: "Ток PV (PV Current)"
        slave: 1
        address: 220
        input_type: holding
        data_type: int16
        unit_of_measurement: "A"
        scale: 0.1
        precision: 1
        scan_interval: 15

      - name: "Мощность PV (PV Power)"
        slave: 1
        address: 223
        input_type: holding
        data_type: int16
        unit_of_measurement: "W"
        scan_interval: 2

      - name: "Мощность зарядки от PV (PV Charging Power)"
        slave: 1
        address: 224
        input_type: holding
        data_type: int16
        unit_of_measurement: "W"
        scan_interval: 15

      - name: "Ток зарядки от PV (PV Charging Current)"
        slave: 1
        address: 234
        input_type: holding
        data_type: int16
        unit_of_measurement: "A"
        scale: 0.1
        precision: 1
        scan_interval: 30


      # =========================
      # НАГРУЗКА / ТЕМПЕРАТУРЫ
      # =========================

      - name: "Нагрузка % (Load Percentage)"
        slave: 1
        address: 225
        input_type: holding
        data_type: int16
        unit_of_measurement: "%"
        precision: 0
        scan_interval: 15

      - name: "Температура DC-DC (DCDC Temperature)"
        slave: 1
        address: 226
        input_type: holding
        data_type: int16
        unit_of_measurement: "°C"
        scan_interval: 60

      - name: "Температура инвертора (Inverter Temperature)"
        slave: 1
