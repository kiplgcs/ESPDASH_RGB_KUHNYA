  anenji_boiler_need_latch:
    name: "ANENJI · Бойлер need latch"
  anenji_pool_need_latch:
    name: "ANENJI · Бассейн need latch"
  anenji_surplus_block_when_rain:
    name: "ANENJI · Останавливать нагрев при дожде"
