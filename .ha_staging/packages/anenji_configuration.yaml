  anenji_weather_max_age_min:
    name: "ANENJI · Максимальный возраст данных погоды"
    min: 10
    max: 120
    step: 5
    mode: box
    unit_of_measurement: "мин"
    icon: mdi:weather-clock

  anenji_surplus_minimum_pv_power_w:
    name: "ANENJI · Порог подтверждения солнца после пробы"
    min: 0
    max: 1000
    step: 10
    mode: slider
    unit_of_measurement: "Вт"
    icon: mdi:solar-power
  anenji_surplus_failed_probe_retry_sec:
    name: 'ANENJI · Пауза перед следующей пробой солнца'
    min: 0
    max: 60
    step: 1
    mode: slider
    unit_of_measurement: 'с'
    icon: mdi:timer-refresh-outline

  anenji_surplus_boiler_start_solar_offset_min:
    name: "Бойлер · сдвиг начала от солнца"
    min: -180
    max: 180
    step: 5
    mode: slider
    unit_of_measurement: "мин"
    icon: mdi:clock-plus-outline
  anenji_surplus_boiler_end_solar_offset_min:
    name: "Бойлер · сдвиг окончания от солнца"
    min: -180
    max: 180
    step: 5
    mode: slider
    unit_of_measurement: "мин"
    icon: mdi:clock-minus-outline
  anenji_surplus_pool_start_solar_offset_min:
    name: "Бассейн · сдвиг начала от солнца"
    min: -180
    max: 180
    step: 5
    mode: slider
    unit_of_measurement: "мин"
    icon: mdi:clock-plus-outline
  anenji_surplus_pool_end_solar_offset_min:
    name: "Бассейн · сдвиг окончания от солнца"
    min: -180
    max: 180
    step: 5
    mode: slider
    unit_of_measurement: "мин"
    icon: mdi:clock-minus-outline

  anenji_surplus_boiler_max_w:
    name: "ANENJI · Максимум бойлеру"
    min: 0
    max: 2000
    step: 50
    mode: box
    unit_of_measurement: "Вт"
    icon: mdi:water-boiler

  anenji_surplus_pool_max_w:
    name: "ANENJI · Максимум нагревателю бассейна"
    min: 0
    max: 3000
    step: 25
    mode: box
    unit_of_measurement: "Вт"
    icon: mdi:pool-thermometer

  # Служебные helpers оставлены для совместимости и диагностики предыдущей версии.
  # Новый прямой регулятор не использует фон или окно из трёх замеров.
  anenji_surplus_previous_grid_w:
    name: "ANENJI · Предыдущий замер мощности сети"
    min: -10000
    max: 10000
    step: 1
    mode: box
    initial: 0
    unit_of_measurement: "Вт"
    icon: mdi:chart-timeline-variant

  anenji_surplus_previous_grid_2_w:
    name: "ANENJI · Предыдущий замер сети №2"
    min: -10000
    max: 10000
    step: 1
    mode: box
    initial: 0
    unit_of_measurement: "Вт"
    icon: mdi:chart-timeline-variant

  # Архивные диагностические значения фона. Они не участвуют в новом расчёте:
  # лимит сравнивается непосредственно с raw Grid Power сети ТНС.
  anenji_surplus_grid_baseline_w:
    name: "ANENJI · Фоновая мощность сети без нагревателей"
    min: -10000
    max: 10000
    step: 1
    mode: box
    initial: 0
    unit_of_measurement: "Вт"
    icon: mdi:transmission-tower

  anenji_surplus_load_baseline_w:
    name: "ANENJI · Фоновая нагрузка дома без нагревателей"
    min: 0
    max: 10000
    step: 1
    mode: box
    initial: 0
    unit_of_measurement: "Вт"
    icon: mdi:home-lightning-bolt

  anenji_surplus_baseline_sample_count:
    name: "ANENJI · Собрано фоновых замеров"
    min: 0
    max: 5
    step: 1
    mode: box
    initial: 0
    icon: mdi:counter

  # Архивная диагностика предыдущего дифференциального PV-регулятора.
  anenji_surplus_last_positive_step_w:
    name: "ANENJI · Последняя положительная ступень"
    min: 0
    max: 5000
    step: 1
    mode: box
    initial: 0
    unit_of_measurement: "Вт"
    icon: mdi:stairs-up

  anenji_surplus_pv_before_increase_w:
    name: "ANENJI · PV перед последней ступенью"
    min: 0
    max: 10000
    step: 1
    mode: box
    initial: 0
    unit_of_measurement: "Вт"
    icon: mdi:solar-power

