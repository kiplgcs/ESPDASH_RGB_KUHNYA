    max: 5000
    step: 1
    mode: box
    initial: 0
    unit_of_measurement: "Вт"

  anenji_dynamic_boiler_limit_w:
    name: "ANENJI · Текущий лимит бойлера"
    min: 0
    max: 2000
    step: 1
    mode: box
    initial: 0
    unit_of_measurement: "Вт"
    icon: mdi:water-boiler

  anenji_dynamic_pool_limit_w:
    name: "ANENJI · Текущий лимит бассейна"
    min: 0
    max: 3000
    step: 1
    mode: box
    initial: 0
    unit_of_measurement: "Вт"
    icon: mdi:pool-thermometer

  anenji_surplus_reserve_w:
    name: "ANENJI · Дополнительный резерв солнечной мощности"
    min: 0
    max: 1000
    step: 25
    mode: box
    unit_of_measurement: "Вт"
    icon: mdi:transmission-tower-export

  anenji_surplus_grid_import_allowance_w:
    name: "ANENJI · Допустимый импорт из сети при нагреве"
    min: 50
    max: 300
    step: 10
    mode: slider
    unit_of_measurement: "Вт"
    icon: mdi:transmission-tower-import

  anenji_surplus_ramp_up_w:
    name: "ANENJI · Шаг ступенчатого набора мощности"
    min: 10
    max: 100
    step: 10
    mode: slider
    unit_of_measurement: "Вт"
    icon: mdi:speedometer-slow

  anenji_surplus_minimum_w:
    name: "ANENJI · Минимальная полезная мощность"
    min: 0
    max: 500
    step: 25
    mode: box
    unit_of_measurement: "Вт"
