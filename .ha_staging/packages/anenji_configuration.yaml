        unit_of_measurement: "V"
        scale: 0.1
        precision: 1
        scan_interval: 300

      - name: "Макс. напряжение зарядки (Maximum Charge Voltage [B])"
        slave: 1
        address: 324
        input_type: holding
        data_type: uint16
        unit_of_measurement: "V"
        scale: 0.1
        precision: 1
        scan_interval: 300

      - name: "Напряжение float (Floating Charge Voltage [C])"
        slave: 1
