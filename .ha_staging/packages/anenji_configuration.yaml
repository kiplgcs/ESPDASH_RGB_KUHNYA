recorder:
  # Быстрые мощности обновляются часто для UI, но в историю пишем отдельные 15-сек. датчики.
  exclude:
    entities:
      - sensor.moshchnost_pv_pv_power
      - sensor.moshchnost_nagruzki_load_power
      - sensor.moshchnost_seti_grid_power
      - sensor.anenji_flow_battery_power_signed
      # Внутренняя память быстрого регулятора: эти значения нужны только
      # текущему контуру и не должны раздувать Recorder ежесекундными записями.
      - input_number.anenji_surplus_previous_grid_w
      - input_number.anenji_surplus_previous_grid_2_w
      - input_number.anenji_surplus_grid_baseline_w
      - input_number.anenji_surplus_load_baseline_w
      - input_number.anenji_surplus_baseline_sample_count
      - input_number.anenji_surplus_last_positive_step_w
      - input_number.anenji_surplus_pv_before_increase_w
      - input_text.anenji_surplus_last_grid_report_token


mqtt:
  binary_sensor:
    - name: "ANENJI Boiler Control Enabled"
      unique_id: anenji_boiler_control_enabled
      state_topic: "homeassistant/anenji/boiler_control_enabled"
      payload_on: "1"
      payload_off: "0"

    - name: "ANENJI Pool Control Enabled"
      unique_id: anenji_pool_control_enabled
      state_topic: "homeassistant/anenji/pool_control_enabled"
      payload_on: "1"
      payload_off: "0"

    # Прямые сигналы запроса нагрева для распределителя солнечного избытка.
    # Бойлер публикует retained 1/0 именно в этом topic (подтверждено прошивкой).
    - name: "ANENJI Boiler Heat Demand"
      unique_id: anenji_boiler_heat_demand_v2
      state_topic: "homeassistant/anenji/esp32_boiler_need"
      payload_on: "1"
      payload_off: "0"
      qos: 1
      # Прошивка отправляет retained heartbeat каждые 3 с. Большой запас не
      # превращает единичную задержку MQTT в ложное снятие запроса.
      expire_after: 45

    # Тот же прямой retained-контракт 1/0 реализован в прошивке бассейна.
    - name: "ANENJI Pool Heat Demand"
      unique_id: anenji_pool_heat_demand_v2
      state_topic: "homeassistant/anenji/esp32_pool_need"
      payload_on: "1"
      payload_off: "0"
      qos: 1
      expire_after: 45

